<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Exercice 5 - A-Frame Physics System</title>
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- aframe-physics-system (version compatible Cannon) -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
  <!-- Script du contrôleur -->
  <script src="player-movement.js"></script>
</head>
<body>
  <a-scene physics="gravity: -9.8; friction: 0.1; restitution: 0.0;">
    
    <!-- Caméra qui regarde la scène -->
    <a-entity position="0 5 12" rotation="-20 0 0">
      <a-camera look-controls="enabled: false"></a-camera>
    </a-entity>

    <!-- Lumières -->
    <a-light type="ambient" color="#BBB"></a-light>
    <a-light type="directional" color="#FFF" intensity="0.6" position="-1 2 1"></a-light>

    <!-- Sol (static-body pour ne pas tomber et arrêter le cube) -->
    <a-plane 
      static-body 
      rotation="-90 0 0" 
      width="40" 
      height="40" 
      color="#3a7d32">
    </a-plane>

    <!-- Joueur (Cube physique dynamique avec notre script) -->
    <a-box 
      id="player"
      dynamic-body="mass: 5; shape: box"
      player-physics-movement="speed: 6; jumpForce: 7"
      position="0 1 0" 
      width="1.5" 
      height="1.5" 
      depth="1.5" 
      color="#e74c3c">
    </a-box>

    <!-- Obstacles statiques pour tester la stabilité lors des impacts -->
    <a-box static-body position="-3 1 -3" color="#3498db" depth="2" height="2" width="2"></a-box>
    <a-box static-body position="3 1 -2" color="#f1c40f" depth="2" height="2" width="2"></a-box>

  </a-scene>
</body>
</html>
