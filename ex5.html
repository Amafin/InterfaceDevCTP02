<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Exercice 6 - Interactions physiques et poussée de cubes</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
  <script src="player-movement.js"></script>
</head>
<body>
  <!-- Gravité réaliste et légère friction au sol pour un arrêt naturel -->
  <a-scene physics="gravity: -18; friction: 0.2; restitution: 0.1;">
    
    <!-- Lumières -->
    <a-light type="ambient" color="#BBB"></a-light>
    <a-light type="directional" color="#FFF" intensity="0.8" position="-10 20 10"></a-light>

    <!-- Sol statique (ne bouge pas, supporte les corps) -->
    <a-plane 
      static-body 
      rotation="-90 0 0" 
      width="100" 
      height="100" 
      color="#3a7d32">
    </a-plane>

    <!-- Suivi Caméra (contrôlée à la souris sans conflit de touches) -->
    <a-entity id="camera-rig" camera-rig-follow="target: #player">
      <a-entity 
        camera 
        position="0 4 8" 
        rotation="-15 0 0" 
        look-controls="pointerLockEnabled: false" 
        wasd-controls="enabled: false">
      </a-entity>
    </a-entity>

    <!-- Joueur : Masse de 8 pour avoir de l'élan et pousser les autres objets -->
    <a-box 
      id="player"
      dynamic-body="mass: 8; shape: box"
      player-physics-movement="speed: 7; jumpForce: 8"
      position="0 1 0" 
      width="1.5" 
      height="1.5" 
      depth="1.5" 
      color="#e74c3c">
    </a-box>

    <!-- Cubes interactifs à pousser (Masse plus légère = 2, shape: box) -->
    <!-- Cube bleu -->
    <a-box 
      pushable-object="mass: 2"
      position="-2 1 -4" 
      width="1.5" 
      height="1.5" 
      depth="1.5" 
      color="#3498db">
    </a-box>

    <!-- Cube jaune -->
    <a-box 
      pushable-object="mass: 2.5"
      position="2 1 -4" 
      width="1.5" 
      height="1.5" 
      depth="1.5" 
      color="#f1c40f">
    </a-box>

    <!-- Cube violet plus lourd (résistance plus forte à la poussée) -->
    <a-box 
      pushable-object="mass: 5"
      position="0 1 -7" 
      width="2" 
      height="2" 
      depth="2" 
      color="#9b59b6">
    </a-box>

  </a-scene>
</body>
</html>
