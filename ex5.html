<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Exercice 5 - A-Frame Physics System</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
  <script src="player-movement.js"></script>
</head>
<body>
  <a-scene physics="gravity: -20; friction: 0.0; restitution: 0.0;">
    
    <!-- Lumières -->
    <a-light type="ambient" color="#DDD"></a-light>
    <a-light type="directional" color="#FFF" intensity="0.7" position="-10 20 10"></a-light>

    <!-- Sol -->
    <a-plane 
      static-body 
      rotation="-90 0 0" 
      width="100" 
      height="100" 
      color="#3a7d32">
    </a-plane>

    <!-- Pivot Caméra qui suit la position du cube sans hériter de sa physique -->
    <a-entity id="camera-rig" camera-rig-follow="target: #player">
      <!-- Caméra contrôlable UNIQUEMENT à la souris (pointerLockEnabled pour cliquer-glisser ou vue libre) -->
      <a-entity 
        camera 
        position="0 4 8" 
        rotation="-15 0 0" 
        look-controls="pointerLockEnabled: false" 
        wasd-controls="enabled: false">
      </a-entity>
    </a-entity>

    <!-- Joueur (Cube physique avec rotation bloquée) -->
    <a-box 
      id="player"
      dynamic-body="mass: 5; shape: box"
      player-physics-movement="speed: 8; jumpForce: 8"
      position="0 1 0" 
      width="1.5" 
      height="1.5" 
      depth="1.5" 
      color="#e74c3c">
    </a-box>

    <!-- Obstacles statiques -->
    <a-box static-body position="-3 1 -4" color="#3498db" depth="2" height="2" width="2"></a-box>
    <a-box static-body position="3 1 -3" color="#f1c40f" depth="2" height="2" width="2"></a-box>
    <a-box static-body position="0 1 -8" color="#9b59b6" depth="3" height="2" width="2"></a-box>

  </a-scene>
</body>
</html>
